name: Auto Price Hunter Bot

on:
  schedule:
    # รันอัตโนมัติทุกๆ 1 ชั่วโมง (ระบบเวลา UTC)
    - cron: '0 * * * *'
  # ปุ่มกดสั่งรันเองจากหน้าเว็บ GitHub (ไว้ใช้ทดสอบ)
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Price Hunter Script
      env:
        # ดึง API Key จาก Secrets มาใช้งานอย่างปลอดภัย
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
      run: |
        python price_hunter.py
